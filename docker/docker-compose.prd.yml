services:
  fretefy_plenobras_com_br:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: fretefy_plenobras_com_br
    env_file:
      - ../.env.prd
    ports:
      - "3005:3000"
    volumes:
      - ../logs:/app/logs
    depends_on:
      dkron:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fretefy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: fretefy_plenobras_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_fretefy_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fretefy-network

  dkron:
    image: dkron/dkron:light
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    command: agent --server --bootstrap-expect=1
    volumes:
      - ../dkron_data:/var/lib/dkron
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/ 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fretefy-network

networks:
  fretefy-network:
    driver: bridge

volumes:
  redis_fretefy_data:
