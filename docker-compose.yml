services:
  app:
    build: .
    restart: always
    env_file:
      - .env.prd
    ports:
      - "3000:3000"
    depends_on:
      - dkron
    networks:
      - fretefy-network

  dkron:
    image: dkron/dkron:light
    restart: always
    environment:
      - TZ=America/Sao_Paulo
    command: agent --server --bootstrap-expect=1
    volumes:
      - ./dkron_data:/var/lib/dkron
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/ 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fretefy-network

networks:
  fretefy-network:
    driver: bridge